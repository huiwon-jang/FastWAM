# openarm_wam_v1 (LeRobot v2.1; 6 robot + 5 human subsets, 28-dim OpenArm V3 layout, 192x256 x 2 views) for FastWAM.
# Recipe = the DROID FastWAM port's geometry + our other OpenArm arms' conventions:
#   * window: num_frames=25 observations (t0..t24) at NATIVE fps (20 or 30 -> 0.8-1.2 s), 24 actions, video frames
#     every 3rd obs -> [0,3,...,24] = 9 frames = 1 + 8 (Wan2.2 VAE temporal 4 -> 3 latent frames), 3 actions / transition
#     (frame-index deltas; NOT seconds, so the 20 fps and 30 fps subsets get the same stride)
#   * views: "vertical" = camera_ego_left (192x256) on TOP, camera_ego_right below -> 384x256 canvas
#     (latent 24x16 -> 12x8 = 96 tokens/frame); a missing view (4 right-only human subsets) is BLACK
#   * action (28) = arm joints [2:16] relative to the t0 state + neck/hands absolute; state (28) absolute
#   * normalization: TRUE global q01/q99 over ALL robot frames (human placeholder zeros and banana's absent groups
#     excluded), file dataset_stats.true_global.json with marker huiwon_true_global_quantiles (dataset + launcher gate)
#   * robot:human = 0.5:0.5 EXACT per per-GPU batch (BalancedGroupEpochSampler); human rows: video loss only
#   * image aug: 'moderate' (rotate +-5 / crop 0.9 / jitter 0.8-1.2, every view, per-view params, frame-consistent)
train:
  _target_: fastwam.datasets.lerobot.openarm_dataset.OpenArmRobotVideoDataset
  dataset_dirs:
    - ${oc.env:OPENARM_DATA_ROOT,/data/huiwon/data/openarm_wam_v1}/robot/openarm_ego_jungwook
    - ${oc.env:OPENARM_DATA_ROOT,/data/huiwon/data/openarm_wam_v1}/robot/openarm_teleop_v3/bottle
    - ${oc.env:OPENARM_DATA_ROOT,/data/huiwon/data/openarm_wam_v1}/robot/openarm_teleop_v3/cup
    - ${oc.env:OPENARM_DATA_ROOT,/data/huiwon/data/openarm_wam_v1}/robot/openarm_teleop_v3/doll
    - ${oc.env:OPENARM_DATA_ROOT,/data/huiwon/data/openarm_wam_v1}/robot/openarm_teleop_v3/snack
    - ${oc.env:OPENARM_DATA_ROOT,/data/huiwon/data/openarm_wam_v1}/robot/banana_v21_openarm28
    - ${oc.env:OPENARM_DATA_ROOT,/data/huiwon/data/openarm_wam_v1}/human_as_openarm28/rlwrld_human_lerobot
    - ${oc.env:OPENARM_DATA_ROOT,/data/huiwon/data/openarm_wam_v1}/human_as_openarm28/openarm_validation_v2_junhyeong/close_air_fryer
    - ${oc.env:OPENARM_DATA_ROOT,/data/huiwon/data/openarm_wam_v1}/human_as_openarm28/openarm_validation_v2_junhyeong/left_hand_box_white_container
    - ${oc.env:OPENARM_DATA_ROOT,/data/huiwon/data/openarm_wam_v1}/human_as_openarm28/openarm_validation_v2_junhyeong/open_air_fryer
    - ${oc.env:OPENARM_DATA_ROOT,/data/huiwon/data/openarm_wam_v1}/human_as_openarm28/anyh2r
  shape_meta:
    images:
      - key: camera_ego_left           # -> observation.images.camera_ego_left (banana alias observation.image.ego_left); canvas TOP
        raw_shape: [3, 192, 256]
        shape: [3, 192, 256]
      - key: camera_ego_right          # -> observation.images.camera_ego_right (alias observation.image.ego_right); canvas BOTTOM
        raw_shape: [3, 192, 256]
        shape: [3, 192, 256]
    action:
      - key: default                   # -> "action", 28-dim raw
        raw_shape: 28
        shape: 28                      # after OpenArmRelativeArmTransform: rel arms [2:16] + abs neck/hands
    state:
      - key: default                   # -> "observation.state", 28-dim absolute
        raw_shape: 28
        shape: 28
  num_frames: 25
  global_sample_stride: 1
  action_video_freq_ratio: 3           # 24 actions, 9 video frames (frame stride 3 at native fps)
  video_size: [384, 256]               # final canvas (H, W) = 2 x 192 (vertical) x 256; multiples of 32
  camera_key: null
  val_set_proportion: 0.0
  is_training_set: true
  # launcher exports FASTWAM_OPENARM_STATS=/data/huiwon/data/openarm_fastwam/dataset_stats.true_global.json (TRUE global
  # q01/q99 over robot frames only, marker huiwon_true_global_quantiles). The dataset class REFUSES any other file.
  pretrained_norm_stats: ${oc.env:FASTWAM_OPENARM_STATS,null}
  skip_padding_as_possible: false
  concat_multi_camera: "vertical"
  group_fractions: [0.5, 0.5]          # [robot, human] per batch, exact
  max_episodes_per_dir: null           # debug knob (CPU smoke)
  processor:
    _target_: fastwam.datasets.lerobot.processors.openarm_processor.OpenArmProcessor
    shape_meta: ${data.train.shape_meta}
    num_obs_steps: ${data.train.num_frames}
    num_output_cameras: 2
    action_output_dim: 28
    proprio_output_dim: 28
    delta_action_dim_mask: null        # padded-step zeroing of the relative arm dims is done by the transform
    action_state_transforms:
      - _target_: fastwam.datasets.lerobot.transforms.openarm.OpenArmRelativeArmTransform
        keys: [default]
        relative_dims: [2, 16]
        zero_padded_relative: true
    use_stepwise_action_norm: false
    norm_default_mode: q01/q99
    norm_exception_mode: null
    action_state_merger:
      _target_: fastwam.datasets.lerobot.transforms.action_state_merger.ConcatLeftAlign
    # 'moderate' aug of our OpenArm WAM runs (ALLVIEW): per view, rotate +-5 deg -> random crop 0.9 area -> resize back
    # -> brightness/contrast/saturation x U(0.8, 1.2). FastWAM/DROID port has no aug; this transform adds it.
    train_transforms:
      - _target_: fastwam.datasets.lerobot.transforms.image.ToTensor
      - _target_: fastwam.datasets.lerobot.transforms.openarm_aug.OpenArmModerateAug
        crop_area: 0.9
        rotate_deg: 5.0
        jitter: 0.2
    val_transforms:
      - _target_: fastwam.datasets.lerobot.transforms.image.ToTensor
  text_embedding_cache_dir: ${oc.env:FASTWAM_OPENARM_TEXT_CACHE,/data/huiwon/data/openarm_fastwam/text_embeds_cache}
  use_text_embed_cache: true
  context_len: 128
  video_backend: ${oc.env:FASTWAM_VIDEO_BACKEND,torchcodec}
