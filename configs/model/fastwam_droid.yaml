# FastWAM (uncond / "first-frame" Fast-WAM) for DROID — identical to fastwam.yaml except:
#   * redirect_common_files: false  -> VAE + umT5 encoder are loaded from the ORIGINAL Wan-AI files
#     (Wan2.2_VAE.pth, models_t5_umt5-xxl-enc-bf16.pth) under $DIFFSYNTH_MODEL_BASE_PATH/Wan-AI/Wan2.2-TI2V-5B
#     instead of DiffSynth-Studio's converted safetensors (which would trigger a modelscope download).
#   * action_dit_pretrained_path resolved from $FASTWAM_ACTION_DIT_PT (absolute, on shared storage).
# Everything else (ActionDiT 1024 hdim / 30 layers, video shift 5.0, action shift 1.0, lambda_action 1.0,
# first_frame_causal video mask, fuse_vae_embedding_in_latents) is the upstream FastWAM default.
_target_: fastwam.runtime.create_fastwam
model_id: Wan-AI/Wan2.2-TI2V-5B
tokenizer_model_id: Wan-AI/Wan2.1-T2V-1.3B
tokenizer_max_len: 128
load_text_encoder: false
proprio_dim: ${data.train.processor.proprio_output_dim}
redirect_common_files: false
mot_checkpoint_mixed_attn: false
compile_training_denoise: false
action_dit_pretrained_path: ${oc.env:FASTWAM_ACTION_DIT_PT,checkpoints/ActionDiT_linear_interp_Wan22_alphascale_1024hdim.pt}
skip_dit_load_from_pretrain: false

video_dit_config:
  has_image_input: false
  patch_size: [1, 2, 2]
  in_dim: 48
  hidden_dim: 3072
  ffn_dim: 14336
  freq_dim: 256
  text_dim: 4096
  out_dim: 48
  num_heads: 24
  attn_head_dim: 128
  num_layers: 30
  eps: 1.0e-06
  seperated_timestep: true
  require_clip_embedding: false
  require_vae_embedding: false
  fuse_vae_embedding_in_latents: true
  use_gradient_checkpointing: ${model.mot_checkpoint_mixed_attn}
  video_attention_mask_mode: "first_frame_causal" # default
  action_conditioned: false
  action_dim: ${data.train.processor.action_output_dim}
  action_group_causal_mask_mode: "group_diagonal"

action_dit_config:
  action_dim: ${data.train.processor.action_output_dim}
  hidden_dim: 1024
  ffn_dim: 4096
  num_heads: 24
  attn_head_dim: 128
  num_layers: 30
  text_dim: 4096
  freq_dim: 256
  eps: 1.0e-06
  use_gradient_checkpointing: ${model.mot_checkpoint_mixed_attn}

video_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000

action_scheduler:
  train_shift: 1.0
  infer_shift: 1.0
  num_train_timesteps: 1000

loss:
  lambda_action: 1.0
